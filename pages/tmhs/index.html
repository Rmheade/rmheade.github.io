<!DOCTYPE html>

<html>
<head>
<script>
      // Domain whitelist - only allow running on studying.work.gd
      const ALLOWED_DOMAINS = ['studying.work.gd', 'rmheade.github.io'];
      
      function checkDomain() {
        try {
          if (window.self === window.top) {
            window.location.href = 'https://studying.work.gd/';
            return false;
          }

          const referrer = document.referrer;
          if (!referrer) {
            window.location.href = 'https://studying.work.gd/no.html';
            return false;
          }

          const parentHost = new URL(referrer).hostname;
          const isAllowed = ALLOWED_DOMAINS.some(domain => 
            parentHost === domain || parentHost.endsWith('.' + domain)
          );

          if (!isAllowed) {
            window.location.href = 'https://studying.work.gd/no.html';
            return false;
          }
          return true;
        } catch (e) {
          window.location.href = 'https://studying.work.gd/no.html';
          return false;
        }
      }

      if (!checkDomain()) {
        throw new Error('Domain security check failed');
      }
 // Listen for tilde key from parent window
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "tilde-pressed") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
        }
      });
      
      // Send tilde key press to parent window
      document.addEventListener("keydown", (e) => {
        if (e.key === "`") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
          window.location.href = 'https://studying.work.gd/';
        }
      });
      
      // Listen for the Escape key press
      document.addEventListener('keydown', (event) => {
          // Check if the key pressed is the Escape key
          if (event.key === 'Escape') {
              // Send a message to the parent window (the main dashboard)
              // The main page will listen for this signal and close the game iframe
              if (window.parent) {
                  window.parent.postMessage('closeGame', '*');
              }
          }
        });
    </script>
<style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
    </style>

<style>
    .watermark-box {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 10px 15px;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        font-family: sans-serif;
        font-size: 14px;
        border-radius: 5px;
        z-index: 9999;
        pointer-events: auto;
        transition: opacity 0.3s ease;
    }
    .watermark-box:hover {
        opacity: 0;
        pointer-events: none;
    }
</style>
</head>
<body>
<iframe frameborder="0" id="inner-iframe" src="https://html-classic.itch.zone/html/15749771/thms/index.html" style="height: 100%; width: 100%; border: none;"></iframe>
<script>
      // Try to inject keyboard listener into iframe (if same-origin)
      const innerIframe = document.getElementById('inner-iframe');
      
      innerIframe.onload = function() {
        try {
          // This only works if the iframe is same-origin
          innerIframe.contentDocument.addEventListener('keydown', (e) => {
            if (e.key === "`" || e.key === "~") {
              window.parent.postMessage({ type: "tilde-pressed" }, "*");
            }
            if (e.key === "Escape") {
              window.parent.postMessage({ type: "escape-pressed" }, "*");
            }
          });
        } catch (err) {
          // Cross-origin iframe - keyboard events won't work from inside
          // But the wrapper's keyboard listener above will still catch them
          console.log("Cross-origin iframe detected - using wrapper keyboard listener");
        }
      };
    </script>

<div class="watermark-box">
    studying.work.gd
</div>
</body>
</html>
