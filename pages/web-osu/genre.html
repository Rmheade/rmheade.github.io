<script>
      // Domain whitelist - only allow running on studying.work.gd
      const ALLOWED_DOMAINS = ['studying.work.gd', 'rmheade.github.io'];
      
      function checkDomain() {
        try {
          if (window.self === window.top) {
            window.location.href = 'https://studying.work.gd/';
            return false;
          }

          const referrer = document.referrer;
          if (!referrer) {
            window.location.href = 'https://studying.work.gd/no.html';
            return false;
          }

          const parentHost = new URL(referrer).hostname;
          const isAllowed = ALLOWED_DOMAINS.some(domain => 
            parentHost === domain || parentHost.endsWith('.' + domain)
          );

          if (!isAllowed) {
            window.location.href = 'https://studying.work.gd/no.html';
            return false;
          }
          return true;
        } catch (e) {
          window.location.href = 'https://studying.work.gd/no.html';
          return false;
        }
      }

      if (!checkDomain()) {
        throw new Error('Domain security check failed');
      }
 // Listen for tilde key from parent window
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "tilde-pressed") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
        }
      });
      
      // Send tilde key press to parent window
      document.addEventListener("keydown", (e) => {
        if (e.key === "`") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
          window.location.href = 'https://studying.work.gd/';
        }
      });
      
      // Listen for the Escape key press
      document.addEventListener('keydown', (event) => {
          // Check if the key pressed is the Escape key
          if (event.key === 'Escape') {
              // Send a message to the parent window (the main dashboard)
              // The main page will listen for this signal and close the game iframe
              if (window.parent) {
                  window.parent.postMessage('closeGame', '*');
              }
          }
        });
    </script>

<script>
            let btns = document.getElementsByClassName("selitem");
            function search(genre, lang) {
                // clear list
                list = document.getElementById("beatmap-list");
                document.getElementById("btnmore").innerText = "查看更多";
                while (list.firstChild) {
                    list.removeChild(list.firstChild);
                }
                addBeatmapList("https://api.sayobot.cn/beatmaplist?0=20&1=0&2=4&5=1&7=" + genre + "&8=" + lang);
                var cur = 20;
                document.getElementById("btnmore").onclick = function() {
                    if (typeof(window.list_endid) == "undefined") {
                        addBeatmapList("https://api.sayobot.cn/beatmaplist?0=20&1="+cur+"&2=4&5=1&7=" + genre + "&8=" + lang);
                    }
                    else {
                        if (window.list_endid == 0)
                            document.getElementById("btnmore").innerText = "已经没有更多了哦！";
                        else
                            addBeatmapList("https://api.sayobot.cn/beatmaplist?0=20&1="+window.list_endid+"&2=4&5=1&7=" + genre + "&8=" + lang);
                    }
                    cur += 20;
                }
                // update buttons state
                for (let i=0; i<btns.length; ++i) {
                    let g = eval(btns[i].getAttribute("genre"));
                    let l = eval(btns[i].getAttribute("lang"));
                    if (g==genre || l==lang) {
                        btns[i].classList.add("active");
                    }
                    else {
                        btns[i].classList.remove("active");
                    }
                }
            }
            let curgenre = 1;
            let curlang = 1;
            search(curgenre, curlang);
            for (let i=0; i<btns.length; ++i) {
                btns[i].onclick = function() {
                    let g = eval(btns[i].getAttribute("genre"));
                    let l = eval(btns[i].getAttribute("lang"));
                    if (g) curgenre = g;
                    if (l) curlang = l;
                    search(curgenre, curlang);
                }
            }
        </script>
