<script>
      // Domain whitelist - only allow running on studying.work.gd
      const ALLOWED_DOMAINS = ['studying.work.gd', 'rmheade.github.io'];
      
      function checkDomain() {
        try {
          if (window.self === window.top) {
            window.location.href = 'https://studying.work.gd/';
            return false;
          }

          const referrer = document.referrer;
          if (!referrer) {
            window.location.href = 'https://studying.work.gd/no.html';
            return false;
          }

          const parentHost = new URL(referrer).hostname;
          const isAllowed = ALLOWED_DOMAINS.some(domain => 
            parentHost === domain || parentHost.endsWith('.' + domain)
          );

          if (!isAllowed) {
            window.location.href = 'https://studying.work.gd/no.html';
            return false;
          }
          return true;
        } catch (e) {
          window.location.href = 'https://studying.work.gd/no.html';
          return false;
        }
      }

      if (!checkDomain()) {
        throw new Error('Domain security check failed');
      }
 // Listen for tilde key from parent window
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "tilde-pressed") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
        }
      });
      
      // Send tilde key press to parent window
      document.addEventListener("keydown", (e) => {
        if (e.key === "`") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
          window.location.href = 'https://studying.work.gd/';
        }
      });
      
      // Listen for the Escape key press
      document.addEventListener('keydown', (event) => {
          // Check if the key pressed is the Escape key
          if (event.key === 'Escape') {
              // Send a message to the parent window (the main dashboard)
              // The main page will listen for this signal and close the game iframe
              if (window.parent) {
                  window.parent.postMessage('closeGame', '*');
              }
          }
        });
    </script>

            //*** customFormat starts
            Date.prototype.customFormat = function(formatString){
                var YYYY,YY,MMMM,MMM,MM,M,DDDD,DDD,DD,D,hhhh,hhh,hh,h,mm,m,ss,s,ampm,AMPM,dMod,th;
                var dateObject = this;
                YY = ((YYYY=dateObject.getFullYear())+"").slice(-2);
                MM = (M=dateObject.getMonth()+1)<10?('0'+M):M;
                MMM = (MMMM=["January","February","March","April","May","June","July","August","September","October","November","December"][M-1]).substring(0,3);
                DD = (D=dateObject.getDate())<10?('0'+D):D;
                DDD = (DDDD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dateObject.getDay()]).substring(0,3);
                th=(D>=10&&D<=20)?'th':((dMod=D%10)==1)?'st':(dMod==2)?'nd':(dMod==3)?'rd':'th';
                formatString = formatString.replace("#YYYY#",YYYY).replace("#YY#",YY).replace("#MMMM#",MMMM).replace("#MMM#",MMM).replace("#MM#",MM).replace("#M#",M).replace("#DDDD#",DDDD).replace("#DDD#",DDD).replace("#DD#",DD).replace("#D#",D).replace("#th#",th);

                h=(hhh=dateObject.getHours());
                if (h==0) h=24;
                if (h>12) h-=12;
                hh = h<10?('0'+h):h;
              hhhh = hhh<10?('0'+hhh):hhh;
                AMPM=(ampm=hhh<12?'am':'pm').toUpperCase();
                mm=(m=dateObject.getMinutes())<10?('0'+m):m;
                ss=(s=dateObject.getSeconds())<10?('0'+s):s;
                return formatString.replace("#hhhh#",hhhh).replace("#hhh#",hhh).replace("#hh#",hh).replace("#h#",h).replace("#mm#",mm).replace("#m#",m).replace("#ss#",ss).replace("#s#",s).replace("#ampm#",ampm).replace("#AMPM#",AMPM);
            }
            //*** customFormat ends

            var list = document.getElementById("history-list");
            function addEntry(summary) {
                let tr = document.createElement("tr");
                list.appendChild(tr);
                function nexttd(content) {
                    let td = document.createElement("td");
                    tr.appendChild(td);
                    if (content.tagName)
                        td.appendChild(content);
                    else
                        td.innerText = content;
                }
                let title = document.createElement("a");
                title.innerText = summary.title + " [" + summary.version + "]";
                title.href = "search.html?q=" + (summary.sid || summary.title);
                nexttd(title);
                nexttd(summary.combo);
                nexttd(summary.score);
                nexttd(summary.grade);
                nexttd(summary.mods);
                nexttd(new Date(summary.time).customFormat("#D# #MMM# #hhhh#:#mm#"));
            }
            if (window.localforage) {
                localforage.getItem("playhistory1000", function(err, item) {
                    if (!err && item && item.length) {
                        item = item.reverse();
                        for (let i=0; i<item.length; ++i) {
                            addEntry(item[i]);
                        }
                    }
                })
            }
            else {
                alert("localforage is not supported.")
            }
        </script>
