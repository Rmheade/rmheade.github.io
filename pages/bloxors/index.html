<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Domain whitelist - only allow running on studying.work.gd
      const ALLOWED_DOMAINS = ['studying.work.gd'];
      
      function checkDomain() {
        try {
          // Get the parent window's origin (works even in iframe)
          const parentOrigin = window.parent.location.origin;
          const parentHost = window.parent.location.hostname;
          
          // Check if parent domain is in whitelist
          const isAllowed = ALLOWED_DOMAINS.some(domain => 
            parentHost === domain || parentHost.endsWith('.' + domain)
          );
          
          if (!isAllowed) {
            console.error('Access denied: This game can only be run on studying.work.gd');
            window.parent.location.href = '/no.html';
            return false;
          }
          return true;
        } catch (e) {
          // If we can't access parent (cross-origin), block it for security
          console.error('Security check failed: Unable to verify domain');
          window.parent.location.href = '/no.html';
          return false;
        }
      }
      
      // Check domain before anything else runs
      if (!checkDomain()) {
        throw new Error('Domain security check failed');
      }
      
      // Prevent direct access - only allow iframe loading
      if (window.self === window.top) {
        window.location.href = 'https://studying.work.gd/';
      }
      
      // Listen for tilde key from parent window
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "tilde-pressed") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
        }
      });
      
      // Send tilde key press to parent window
      document.addEventListener("keydown", (e) => {
        if (e.key === "`") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
          window.location.href = 'https://studying.work.gd/';
        }
      });
      
      // Listen for the Escape key press
      document.addEventListener('keydown', (event) => {
          // Check if the key pressed is the Escape key
          if (event.key === 'Escape') {
              // Send a message to the parent window (the main dashboard)
              // The main page will listen for this signal and close the game iframe
              if (window.parent) {
                  window.parent.postMessage('closeGame', '*');
              }
          }
        });
    </script>
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Bloxors | 3kh0</title>
    <link rel="shortcut icon" type="image/ico" href="favicon.ico">
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        "publicPath": undefined,
        "polyfills": true,
        "autoplay": "auto",
        "unmuteOverlay": "visible",
        "backgroundColor": "black",
        "letterbox": "fullscreen",
        "warnOnUnsupportedContent": true,
        "contextMenu": true,
        "showSwfDownload": false,
        "upgradeToHttps": window.location.protocol === "https:",
        "maxExecutionDuration": {"secs": 15, "nanos": 0},
        "logLevel": "error",
        "base": null,
        "menu": true,
        "salign": "",
        "scale": "showAll",
        "quality": "high",
      };
    </script>
  </head>
  <body style="background-color:black;">
    <center>
      <img src="title.png" style="padding:5px;width:300px;">
      <div id="container" style="border: #ccc 3px solid;height:600px;width:937px;"></div>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
          const ruffle = window.RufflePlayer.newest();
          const player = ruffle.createPlayer();
          const container = document.getElementById("container");
          container.appendChild(player);
          player.style.height = "600px";
          player.style.width = "937px";
          player.load("bloxors.swf");
      });
    </script>
    <script src="ruffle/ruffle.js"></script>
    <script src="/js/main.js"></script>
    </center>
  </body>
</html>
