<!DOCTYPE html>
<html manifest="offline.appcache">
  <head>
    <script>
      // Domain whitelist - only allow running on studying.work.gd
      const ALLOWED_DOMAINS = ['studying.work.gd'];
      
      function checkDomain() {
        try {
          // Get the parent window's origin (works even in iframe)
          const parentOrigin = window.parent.location.origin;
          const parentHost = window.parent.location.hostname;
          
          // Check if parent domain is in whitelist
          const isAllowed = ALLOWED_DOMAINS.some(domain => 
            parentHost === domain || parentHost.endsWith('.' + domain)
          );
          
          if (!isAllowed) {
            console.error('Access denied: This game can only be run on studying.work.gd');
            window.parent.location.href = '/no.html';
            return false;
          }
          return true;
        } catch (e) {
          // If we can't access parent (cross-origin), block it for security
          console.error('Security check failed: Unable to verify domain');
          window.parent.location.href = '/no.html';
          return false;
        }
      }
      
      // Check domain before anything else runs
      if (!checkDomain()) {
        throw new Error('Domain security check failed');
      }
      
      // Prevent direct access - only allow iframe loading
      if (window.self === window.top) {
        window.location.href = 'https://studying.work.gd/';
      }
      
      // Listen for tilde key from parent window
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "tilde-pressed") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
        }
      });
      
      // Send tilde key press to parent window
      document.addEventListener("keydown", (e) => {
        if (e.key === "`") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
          window.location.href = 'https://studying.work.gd/';
        }
      });
      
      // Listen for the Escape key press
      document.addEventListener('keydown', (event) => {
          // Check if the key pressed is the Escape key
          if (event.key === 'Escape') {
              // Send a message to the parent window (the main dashboard)
              // The main page will listen for this signal and close the game iframe
              if (window.parent) {
                  window.parent.postMessage('closeGame', '*');
              }
          }
        });
    </script>
<meta charset="UTF-8" />

  <body>
    <div id="c2canvasdiv">
      <canvas id="c2canvas" width="1920" height="1080">
        <h1>
          Your browser does not support HTML5.
        </h1>
      </canvas>
    </div>
    <script src="jquery-2.1.1.min.js"></script>
    <script src="c2runtime.js"></script>
    <script>
      jQuery(document).ready(function () {
        cr_createRuntime("c2canvas");
      });
      function onVisibilityChanged() {
        if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden) cr_setSuspended(true);
        else cr_setSuspended(false);
      }
      document.addEventListener("visibilitychange", onVisibilityChanged, false);
      document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
      document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
      document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

      function OnRegisterSWError(e) {
        console.warn("Failed to register service worker: ", e);
      }
      window.C2_RegisterSW = function C2_RegisterSW() {
        if (!navigator.serviceWorker) return;
        try {
          navigator.serviceWorker
            .register("sw.js", { scope: "./" })
            .then(function (reg) {
              console.log("Registered service worker on " + reg.scope);
            })
            .catch(OnRegisterSWError);
        } catch (e) {
          OnRegisterSWError(e);
        }
      };
    </script>
    <script type="application/javascript" src="/js/main.js"></script>
  </body>
