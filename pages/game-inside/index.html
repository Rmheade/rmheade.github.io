<!DOCTYPE html>
<html lang="en-us">
  <head>
    <script>
      // Domain whitelist - only allow running on studying.work.gd
      const ALLOWED_DOMAINS = ['studying.work.gd'];
      
      function checkDomain() {
        try {
          // Get the parent window's origin (works even in iframe)
          const parentOrigin = window.parent.location.origin;
          const parentHost = window.parent.location.hostname;
          
          // Check if parent domain is in whitelist
          const isAllowed = ALLOWED_DOMAINS.some(domain => 
            parentHost === domain || parentHost.endsWith('.' + domain)
          );
          
          if (!isAllowed) {
            console.error('Access denied: This game can only be run on studying.work.gd');
            window.parent.location.href = '/no.html';
            return false;
          }
          return true;
        } catch (e) {
          // If we can't access parent (cross-origin), block it for security
          console.error('Security check failed: Unable to verify domain');
          window.parent.location.href = '/no.html';
          return false;
        }
      }
      
      // Check domain before anything else runs
      if (!checkDomain()) {
        throw new Error('Domain security check failed');
      }
      
      // Prevent direct access - only allow iframe loading
      if (window.self === window.top) {
        window.location.href = 'https://studying.work.gd/';
      }
      
      // Listen for tilde key from parent window
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "tilde-pressed") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
        }
      });
      
      // Send tilde key press to parent window
      document.addEventListener("keydown", (e) => {
        if (e.key === "`") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
          window.location.href = 'https://studying.work.gd/';
        }
      });
      
      // Listen for the Escape key press
      document.addEventListener('keydown', (event) => {
          // Check if the key pressed is the Escape key
          if (event.key === 'Escape') {
              // Send a message to the parent window (the main dashboard)
              // The main page will listen for this signal and close the game iframe
              if (window.parent) {
                  window.parent.postMessage('closeGame', '*');
              }
          }
        });
    </script>
<meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Game Inside a Game | 3kh0</title>
    <link rel="icon" href="img/icon.png">
    <link rel="shortcut icon" href="img/icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <script src="/js/main.js"></script>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webv0_2d.loader.js";
      var config = {
        dataUrl: buildUrl + "/webv0_2d.data",
        frameworkUrl: buildUrl + "/webv0_2d.framework.js",
        codeUrl: buildUrl + "/webv0_2d.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Sam Hogan",
        productName: "Game Inside a Game",
        productVersion: "0.2",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "540px";
      }
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
