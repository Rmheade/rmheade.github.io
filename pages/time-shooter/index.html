<!DOCTYPE html>

<html lang="en-us">
<head>
    <script>
      // Domain whitelist - only allow running on studying.work.gd
      const ALLOWED_DOMAINS = ['studying.work.gd'];
      
      function checkDomain() {
        try {
          // Get the parent window's origin (works even in iframe)
          const parentOrigin = window.parent.location.origin;
          const parentHost = window.parent.location.hostname;
          
          // Check if parent domain is in whitelist
          const isAllowed = ALLOWED_DOMAINS.some(domain => 
            parentHost === domain || parentHost.endsWith('.' + domain)
          );
          
          if (!isAllowed) {
            console.error('Access denied: This game can only be run on studying.work.gd');
            window.parent.location.href = '/no.html';
            return false;
          }
          return true;
        } catch (e) {
          // If we can't access parent (cross-origin), block it for security
          console.error('Security check failed: Unable to verify domain');
          window.parent.location.href = '/no.html';
          return false;
        }
      }
      
      // Check domain before anything else runs
      if (!checkDomain()) {
        throw new Error('Domain security check failed');
      }
      
      // Prevent direct access - only allow iframe loading
      if (window.self === window.top) {
        window.location.href = 'https://studying.work.gd/';
      }
      
      // Listen for tilde key from parent window
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "tilde-pressed") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
        }
      });
      
      // Send tilde key press to parent window
      document.addEventListener("keydown", (e) => {
        if (e.key === "`") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
          window.location.href = 'https://studying.work.gd/';
        }
      });
      
      // Listen for the Escape key press
      document.addEventListener('keydown', (event) => {
          // Check if the key pressed is the Escape key
          if (event.key === 'Escape') {
              // Send a message to the parent window (the main dashboard)
              // The main page will listen for this signal and close the game iframe
              if (window.parent) {
                  window.parent.postMessage('closeGame', '*');
              }
          }
        });
    </script>

<canvas id="unity-canvas"></canvas>

<div id="loading-cover" style="display:none;">
<div id="unity-loading-bar">
<div id="unity-logo"><img src="logo.png"/></div>

<div id="unity-progress-bar-full"></div>
</div>
<div class="spinner"></div>
</div>
</div>
<div id="unity-fullscreen-button" style="display: none;"></div>
<script>
      const hideFullScreenButton = "1";
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/TimeGD.loader.js";
      const config = {
        dataUrl: buildUrl + "/TimeGD.data.unityweb",
        frameworkUrl: buildUrl + "/TimeGD.framework.js.unityweb",
        codeUrl: buildUrl + "/TimeGD.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GoGoMan",
        productName: "Time Shooter",
        productVersion: "1.0",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const spinner = document.querySelector('.spinner');

      const canFullscreen = (function() {
        for (const key of [
            'exitFullscreen',
            'webkitExitFullscreen',
            'webkitCancelFullScreen',
            'mozCancelFullScreen',
            'msExitFullscreen',
          ]) {
          if (key in document) {
            return true;
          }
        }
        return false;
      }());

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      }
      canvas.style.background = "url('" + buildUrl + "/TimeGD.jpg') center / cover";
      loadingCover.style.display = "";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          loadingCover.style.display = "none";
          if (canFullscreen) {
            if (!hideFullScreenButton) {
              fullscreenButton.style.display = "";
            }
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
</body>
