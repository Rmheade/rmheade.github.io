<!DOCTYPE html>
<html>
  <head>
    <script>
      // Prevent direct access - only allow iframe loading
      if (window.self === window.top) {
        window.location.href = '/';
      }
      
      // Listen for keyboard events from the iframe via postMessage
      window.addEventListener("message", (event) => {
        // If iframe sends a tilde or escape key, relay it to the parent window
        if (event.data && (event.data.type === "tilde-pressed" || event.data.type === "escape-pressed")) {
          window.parent.postMessage(event.data, "*");
        }
      });
      
      // Capture keyboard on this wrapper and send to parent
      document.addEventListener("keydown", (e) => {
        if (e.key === "`" || e.key === "~") {
          window.parent.postMessage({ type: "tilde-pressed" }, "*");
        }
        if (e.key === "Escape") {
          window.parent.postMessage({ type: "escape-pressed" }, "*");
        }
      });
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <iframe id="inner-iframe" src="https://gptlite.vercel.app/chat" frameborder="0" style="height: 100%; width: 100%; border: none;"></iframe>
    
    <script>
      // Try to inject keyboard listener into iframe (if same-origin)
      const innerIframe = document.getElementById('inner-iframe');
      
      innerIframe.onload = function() {
        try {
          // This only works if the iframe is same-origin
          innerIframe.contentDocument.addEventListener('keydown', (e) => {
            if (e.key === "`" || e.key === "~") {
              window.parent.postMessage({ type: "tilde-pressed" }, "*");
            }
            if (e.key === "Escape") {
              window.parent.postMessage({ type: "escape-pressed" }, "*");
            }
          });
        } catch (err) {
          // Cross-origin iframe - keyboard events won't work from inside
          // But the wrapper's keyboard listener above will still catch them
          console.log("Cross-origin iframe detected - using wrapper keyboard listener");
        }
      };
    </script>
  </body>
</html>
