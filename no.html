<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrong Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .warning-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            color: #e74c3c;
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .subtitle {
            color: #555;
            font-size: 18px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .domain-display {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 40px 0;
            border-radius: 8px;
            text-align: left;
        }

        .domain-display p {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .correct-domain {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .footer-text {
            color: #999;
            font-size: 13px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="warning-icon">⚠️</div>
        
        <h1>Wrong Website!</h1>
        
        <p class="subtitle">
            This is being hosted on the wrong website!
        </p>

        <div class="domain-display">
            <p>The correct website to use is:</p>
            <div class="correct-domain">studying.work.gd</div>
        </div>

        <p class="subtitle">
            Please visit the official website to access this content.
        </p>

        <a href="https://studying.work.gd" class="cta-button" target="_blank">
            Go to studying.work.gd
        </a>

        <p class="footer-text">
            If you believe this is a mistake, please contact support.
        </p>
    </div>
</body>
</html>
